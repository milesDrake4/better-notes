services:
  - type: web
    name: better-notes-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: FREE_SCAN_LIMIT
        value: 3
      - key: AI_RATE_LIMIT_MAX
        value: 30
      - key: AI_RATE_LIMIT_WINDOW_MS
        value: 3600000
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: HOST
        value: 0.0.0.0
      - key: REQUEST_BODY_LIMIT_BYTES
        value: 60000000
      - key: OPENAI_TIMEOUT_MS
        value: 80000
      - key: SUPABASE_AUTH_TIMEOUT_MS
        value: 15000
